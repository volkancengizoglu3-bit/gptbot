name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' 2>/dev/null | sort -u)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" muimm-bot.apk
          sha256sum muimm-bot.apk > muimm-bot.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muimm-bot-apk
          path: |
            muimm-bot.apk
            muimm-bot.apk.sha256
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated debug APK build.
            Commit: ${{ github.sha }}
            SHA-256 is attached as muimm-bot.apk.sha256.
          files: |
            muimm-bot.apk
            muimm-bot.apk.sha256
